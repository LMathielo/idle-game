name: CI

# Typecheck, tests and a full export on every pull request into dev or main
# (publishing to Expo Go happens in eas-update.yml, only on pushes to dev and main).
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Check name `CI`: this is the required status check in main's branch protection rule.
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used by the SQL repository tests) needs Node 22.13+.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Same export `eas update --platform all` runs. app.json `platforms` must stay [ios, android]:
      # if web sneaks back in, this fails here instead of at publish time.
      - name: Export all platforms (must be iOS + Android only)
        run: |
          npx expo export --platform all --output-dir /tmp/export-check
          ls /tmp/export-check/_expo/static/js
          if [ -d /tmp/export-check/_expo/static/js/web ]; then
            echo "::error::Web bundle was produced. This app is mobile only: keep app.json expo.platforms = [ios, android]."
            exit 1
          fi
